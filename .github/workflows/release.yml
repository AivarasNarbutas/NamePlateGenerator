name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/NamePlate.App -c Release -r win-x64 --self-contained -o publish

      - name: Zip
        run: Compress-Archive -Path publish\* -DestinationPath NamePlateGenerator-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} NamePlateGenerator-${{ github.ref_name }}-win-x64.zip --title "Name Plate Generator ${{ github.ref_name }}" --generate-notes
